{% extends "base.html" %}

{% block title %}
Página Inicial
{% endblock %}

{% block content %}

<main>

    <h1>Bem-vinda(o)!</h1>

    <hr>

    <section class="cards">
        <a href="/pagina-livros"><div class="card">
            <img src="{{ url_for('static', path='img/livros.png') }}">
            <p>Livros Cadastrados</p>
        </div></a>

        <a href="/pagina-emprestimos"><div class="card">
            <img src="{{ url_for('static', path='img/emprestimos.png') }}">
            <p>Empréstimos</p>
        </div></a>

        <a href="/pagina-leitores"><div class="card">
            <img src="{{ url_for('static', path='img/usuarios.png') }}">
            <p>Leitores</p>
        </div></a>

    </section>

    <hr>

    <section class="botoes">

        <a href="/cadastro-livro">
            <button>Cadastrar novo livro</button>
        </a>

        <a href="/cadastro-leitor">
            <button>Cadastrar Leitor</button>
        </a>

    </section>

</main>

{% endblock %}
