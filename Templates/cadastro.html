{% extends "base_auth.html" %}

{% block title %}
Cadastro
{% endblock %}

{% block content %}

<h1>FAÇA SEU CADASTRO</h1>

<form action="/usuarios" method="post">

    <h5>Nome</h5>
    <input type="text" name="nome" required>

    <h5>Email</h5>
    <input type="email" name="email" required>

    <h5>Senha</h5>
    <input type="password" name="senha" required>

    <button type="submit">
        CADASTRAR
    </button>

</form>

<p>
    Já possui conta?
    <a href="/">Entrar</a>
</p>

{% endblock %}
