{% extends "base.html" %}

{% block title %}
Cadastro de Livro
{% endblock %}

{% block content %}

<main class="livro-main">

    <div class="livro-card">

        <h2>CADASTRO DE LIVRO</h2>

        <form action="/livros" method="POST" enctype="multipart/form-data">

    <input
        type="text"
        name="titulo"
        placeholder="Título">

    <input
        type="text"
        name="autor"
        placeholder="Autor">

    <input
        type="text"
        name="categoria"
        placeholder="Categoria">
        
    <input
        type="file"
        name="capa">

    <button type="submit">
        Cadastrar
    </button>

</form>

    </div>

</main>

{% endblock %}
