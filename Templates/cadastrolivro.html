{% extends "base.html" %}

{% block title %}
Cadastro de Livro
{% endblock %}

{% block content %}

<main class="livro-main">

    <section class="livro-card">

        <h2>CADASTRO DE LIVRO</h2>

        <form
            action="/livros"
            method="POST"
            enctype="multipart/form-data"
        >

            <div class="campo">

                <label>Título:</label>

                <input
                    type="text"
                    name="titulo"
                    required
                >

            </div>


            <div class="campo">

                <label>Autor:</label>

                <input
                    type="text"
                    name="autor"
                    required
                >

            </div>


            <div class="campo">

                <label>Categoria:</label>

                <input
                    type="text"
                    name="categoria"
                    required
                >

            </div>


            <div class="campo">

                <label>ISBN:</label>

                <input
                    type="text"
                    name="isbn"
                    required
                >

            </div>


            <div class="campo">

                <label>Quantidade:</label>

                <input
                    type="number"
                    name="quantidade_total"
                    min="1"
                    value="1"
                    required
                >

            </div>


            <label class="upload">

                Faça o upload da capa +

                <input
                    type="file"
                    name="capa"
                    accept="image/*"
                    hidden
                >

            </label>


            <div class="botoes-livro">

                <button type="reset">
                    Cancelar
                </button>

                <button type="submit">
                    Salvar
                </button>

            </div>

        </form>

    </section>

</main>

{% endblock %}
