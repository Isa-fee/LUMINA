```html
{% extends "base.html" %}

{% block title %}
Cadastro de Empréstimo
{% endblock %}

{% block content %}

<main class="emprestimo-main">

    <section class="emprestimo-card">

        <h2>CADASTRO DE EMPRÉSTIMO</h2>

        <form action="/cadastro-emprestimo" method="POST">

            <div class="campo">

                <label>Leitor:</label>

                <select name="leitor_id" required>

                    <option value="">
                        Selecione um leitor
                    </option>

                    {% for leitor in leitores %}

                    <option value="{{ leitor.id }}">
                        {{ leitor.nome }} - {{ leitor.email }}
                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="campo">

                <label>Livro:</label>

                <select name="livro_id" required>

                    <option value="">
                        Selecione um livro
                    </option>

                    {% for livro in livros %}

                    <option value="{{ livro.id }}">
                        {{ livro.titulo }}
                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="botoes-emprestimo">

                <button type="reset">
                    Cancelar
                </button>

                <button type="submit">
                    Salvar
                </button>

            </div>

        </form>

    </section>

</main>

{% endblock %}
```
