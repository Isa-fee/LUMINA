{% extends "base.html" %}

{% block title %}
Editar Livro
{% endblock %}

{% block content %}

<main>

    <h1>Editar Livro</h1>

    <form action="/editar-livro/{{ livro.id }}" method="post">

        <label>Título</label>
        <input
            type="text"
            name="titulo"
            value="{{ livro.titulo }}"
            required
        >

        <label>Autor</label>
        <input
            type="text"
            name="autor"
            value="{{ livro.autor }}"
            required
        >

        <label>Categoria</label>
        <input
            type="text"
            name="categoria"
            value="{{ livro.categoria }}"
            required
        >
        <div class="campo">

            <label>ISBN:</label>

            <input
                type="text"
                name="isbn"
                value="{{ livro.isbn }}"
                required
            >
        </div>

        <label>Quantidade disponível</label>
        <input
            type="number"
            name="quantidade_disponivel"
            value="{{ livro.quantidade_disponivel }}"
            min="0"
            required
        >

        <button type="submit">
            Salvar Alterações
        </button>

    </form>

</main>

{% endblock %}
