{% extends "base.html" %}

{% block title %}
Editar Livro
{% endblock %}

{% block content %}

<main class="livro-main">

    <section class="livro-card">

        <h2>EDITAR LIVRO</h2>

        <form
            action="/editar-livro/{{ livro.id }}"
            method="post"
            enctype="multipart/form-data"
        >

            <div class="campo">

                <label>Título:</label>

                <input
                    type="text"
                    name="titulo"
                    value="{{ livro.titulo }}"
                    required
                >

            </div>


            <div class="campo">

                <label>Autor:</label>

                <input
                    type="text"
                    name="autor"
                    value="{{ livro.autor }}"
                    required
                >

            </div>


            <div class="campo">

                <label>Categoria:</label>

                <input
                    type="text"
                    name="categoria"
                    value="{{ livro.categoria }}"
                    required
                >

            </div>


            <div class="campo">

                <label>ISBN:</label>

                <input
                    type="text"
                    name="isbn"
                    value="{{ livro.isbn }}"
                    required
                >

            </div>


            <div class="campo">

                <label>Quantidade total:</label>

                <input
                    type="number"
                    name="quantidade_total"
                    value="{{ livro.quantidade_total }}"
                    min="1"
                    required
                >

            </div>


            <div class="campo">

                <label>Quantidade disponível:</label>

                <input
                    type="text"
                    value="{{ livro.quantidade_disponivel }}"
                    readonly
                >

            </div>


            <div class="campo">

                <label>Capa atual:</label>

                {% if livro.capa %}

                    <img
                        src="/{{ livro.capa }}"
                        alt="Capa do livro"
                        width="120"
                    >

                {% else %}

                    <p>
                        Este livro não possui capa.
                    </p>

                {% endif %}

            </div>


            <div class="campo">

                <label>Alterar capa:</label>

                <input
                    type="file"
                    name="capa"
                    accept="image/*"
                >

            </div>


            <div class="botoes-livro">

                <a href="/pagina-livros">

                    <button type="button">
                        Cancelar
                    </button>

                </a>


                <button type="submit">
                    Salvar alterações
                </button>

            </div>

        </form>

    </section>

</main>

{% endblock %}
