{% extends "base_auth.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<h1>FAÇA LOGIN </h1>

<form action="/login" method="post">
    <h5>E-MAIL</h5>
    <input type="email" name="email" required>

    <h5>SENHA</h5>
    <input type="password" name="senha" required>

    <button type="submit">
            ENTRAR
    </button>
</form>



<p>
    Não possui conta?
    <a href="/cadastro">Cadastre-se</a>
</p>

{% endblock %}
