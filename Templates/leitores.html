{% extends "base.html" %}

{% block title %}
Leitores
{% endblock %}

{% block content %}

<main>

    <section class="topo-leitores">

        <div class="titulo">

            <h1>Leitores Cadastrados</h1>

        </div>

        <a href="/cadastro-leitor">

            <button class="novo-leitor">
                + Novo leitor
            </button>

        </a>

    </section>

    <section class="lista-leitores">

        {% for leitor in leitores %}

        <div class="leitor">

            <div class="dados">

                <p>
                    <strong>NOME:</strong>
                    {{ leitor.nome }}
                </p>

                <p>
                    <strong>E-MAIL:</strong>
                    {{ leitor.email }}
                </p>

                <div class="acoes">

                <strong>AÇÕES:</strong>


                <a href="/editar-leitor/{{ leitor.id }}">
                    <button>
                        Editar
                    </button>
                </a>


                <form action="/excluir-leitor/{{ leitor.id }}" method="post">

                    <button>
                        Excluir
                    </button>

                </form>
                <a href="/leitor/{{ leitor.id }}/detalhes">

                    <button>
                        Ver detalhes
                    </button>

                </a>


            </div>

            </div>

        </div>

        {% endfor %}

    </section>

</main>

{% endblock %}
